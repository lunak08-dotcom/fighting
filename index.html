<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 응원 한마디</title>
  <style>
    :root {
      --bg: #fff8ec;
      --card: #ffffff;
      --text: #2b2520;
      --muted: #75695e;
      --accent: #e8590c;
      --accent-press: #c2470a;
      --border: #e6d9c8;
      --error: #b3261e;
      --error-bg: #fdecea;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px 40px;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      font-size: 20px;
      line-height: 1.6;
    }

    main {
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: 34px;
      line-height: 1.3;
      text-align: center;
    }

    .lead {
      margin: 0 0 28px;
      color: var(--muted);
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      color: var(--text);
      font: inherit;
      font-size: 22px;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .hint {
      margin: 8px 0 20px;
      color: var(--muted);
      font-size: 16px;
    }

    button {
      width: 100%;
      min-height: 68px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active { background: var(--accent-press); }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #result {
      margin-top: 28px;
      min-height: 160px;
      padding: 28px 20px;
      border: 2px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.5;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    #result.empty,
    #result.loading {
      color: var(--muted);
      font-size: 20px;
      font-weight: 400;
    }

    #result.error {
      border-color: var(--error);
      background: var(--error-bg);
      color: var(--error);
      font-size: 20px;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <main>
    <h1>오늘의 응원 한마디</h1>
    <p class="lead">닉네임을 적고 버튼을 눌러 보세요.</p>

    <form id="cheer-form">
      <label for="name">공개용 닉네임</label>
      <input id="name" name="name" type="text" maxlength="20" autocomplete="off" placeholder="예: 햇살">
      <p class="hint">비워 두면 "여러분"으로 불러 드려요. 실명이나 개인정보는 적지 마세요.</p>
      <button id="submit" type="submit">응원 받기</button>
    </form>

    <div id="result" class="empty" role="status" aria-live="polite">
      여기에 응원 문장이 나타나요.
    </div>
  </main>

  <script>
    // 응원 문장은 서버(api/message.js)에만 있다. 화면은 받은 문장을 그대로 보여 주기만 한다.
    const API_URL = "api/message";

    const form = document.getElementById("cheer-form");
    const nameInput = document.getElementById("name");
    const button = document.getElementById("submit");
    const result = document.getElementById("result");

    function show(state, text) {
      result.className = state;
      result.textContent = text;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      show("loading", "응원 문장을 가져오는 중이에요…");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: nameInput.value }),
        });

        if (!response.ok) {
          throw new Error("서버 응답 코드 " + response.status);
        }

        const data = await response.json();
        if (!data || typeof data.text !== "string" || !data.text) {
          throw new Error("응답 형식이 올바르지 않음");
        }

        show("", data.text);
      } catch (error) {
        console.error(error);
        show("error", "응원 문장을 가져오지 못했어요. 서버에 연결할 수 없어요. 잠시 후 다시 시도해 주세요.");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
